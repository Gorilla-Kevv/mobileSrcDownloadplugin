name: Release APK

# 两种触发方式：
#   1. 手动：Actions 页面 → Run workflow（可选是否自增版本号）
#   2. 打标签：git tag v1.0.3 && git push origin v1.0.3
#
# 需要在本仓库 Settings → Secrets and variables → Actions 配置（否则 release 会落回 debug 签名，
# 签名不一致会导致老用户无法覆盖安装）：
#   KEYSTORE_BASE64    —— app/signing/clipdown.jks 的 base64（base64 -w0 app/signing/clipdown.jks）
#   KEYSTORE_PASSWORD  —— keystore 密码
#   KEY_ALIAS          —— key alias
#   KEY_PASSWORD       —— key 密码
#
# 发布位置：默认发到**当前仓库**的 Release。若当前仓库是私有的，应用内更新无法匿名下载，
# 请把本 workflow 放到公开分发仓库，或设置 DIST_REPO 变量指向公开仓库（需要 PAT）。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号自增方式'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major, none]
      notes:
        description: '更新说明（可留空）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 还原签名 keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p app/signing
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/signing/clipdown.jks
            cat > signing.properties <<EOF
          storeFile=app/signing/clipdown.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "已配置正式签名"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，本次将使用 debug 签名（老用户无法覆盖安装）"
          fi

      - name: 版本号自增
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/publish-release.sh --bump "${{ inputs.bump }}" --dry-run --skip-build >/dev/null 2>&1 || true
          # 复用脚本的版本自增逻辑（dry-run 只打印，这里再真正写一次）
          case "${{ inputs.bump }}" in
            none) ;;
            *)
              V=$(grep '^versionName=' version.properties | cut -d= -f2)
              C=$(grep '^versionCode=' version.properties | cut -d= -f2)
              IFS='.' read -r MA MI PA <<< "$V"
              case "${{ inputs.bump }}" in
                patch) PA=$((PA+1)) ;;
                minor) MI=$((MI+1)); PA=0 ;;
                major) MA=$((MA+1)); MI=0; PA=0 ;;
              esac
              sed -i "s/^versionName=.*/versionName=${MA}.${MI}.${PA}/" version.properties
              sed -i "s/^versionCode=.*/versionCode=$((C+1))/" version.properties
              ;;
          esac
          cat version.properties

      - name: 构建 + 全量单测
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :parser:test \
            :downloader:testDebugUnitTest :app:testDebugUnitTest --console=plain

      - name: 生成 update.json 与资产
        id: dist
        run: |
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          VERSION_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '\r')
          ASSET=$(grep '^clipdown.apkAssetName=' gradle.properties | cut -d= -f2- | tr -d '\r')
          ASSET="${ASSET:-clipdown-release.apk}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$ASSET"
          SIZE=$(stat -c %s "dist/$ASSET")
          SHA=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)
          NOTES='${{ inputs.notes }}'
          [ -z "$NOTES" ] && NOTES="测试版 ${VERSION_NAME}"
          cat > dist/update.json <<JSON
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "notes": "${NOTES}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${ASSET}",
            "sha256": "${SHA}",
            "sizeBytes": ${SIZE},
            "mandatory": false
          }
          JSON
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.dist.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --title "ClipDown ${{ steps.dist.outputs.name }}" \
              --notes "${{ inputs.notes || '测试版构建' }}" --latest dist/*
          fi
