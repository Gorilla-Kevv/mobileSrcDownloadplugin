org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

kotlin.code.style=official
kotlin.incremental=true

# ── 应用内更新通道 ───────────────────────────────────────────────
# 清单地址用"最新发布固定链接"：不走 GitHub API、不需要 token、无匿名速率限制。
# 代价是**托管方必须公开可匿名访问**。
#
# 国内网络提示：github.com 在部分网络下不可达/极慢（实测本机需代理才能访问，
# 模拟器直连超时）。若测试者网络访问 GitHub 不稳定，把下面两项指向国内可达的托管
# （Gitee Releases / 阿里云 OSS / 腾讯云 COS / 自建静态服务）即可，**无需改代码**：
#   clipdown.updateManifestUrl=https://your-host/clipdown/update.json
#   clipdown.updateApkUrl=https://your-host/clipdown/clipdown-release.apk
# 留空则按 clipdown.updateRepo 拼出 GitHub Release 的固定链接。
clipdown.updateRepo=Gorilla-Kevv/mobileSrcDownloadplugin
clipdown.apkAssetName=clipdown-release.apk
clipdown.updateManifestUrl=
clipdown.updateApkUrl=
