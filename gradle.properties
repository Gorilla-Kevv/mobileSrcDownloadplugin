org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

kotlin.code.style=official
kotlin.incremental=true

# ── 应用内更新通道 ───────────────────────────────────────────────
# 发布仓库（owner/repo）。**必须是公开仓库**：私有仓库的 Release 资产无法匿名下载，
# 应用侧就没有 token 可用。当前源码仓库本身已转为公开，故直接发在这里。
# 可用 -Pclipdown.updateRepo=xxx/yyy 覆盖（发布脚本同此参数）。
clipdown.updateRepo=Gorilla-Kevv/mobileSrcDownloadplugin
# Release 资产里的 APK 文件名（发布脚本与更新器约定一致）
clipdown.apkAssetName=clipdown-release.apk
